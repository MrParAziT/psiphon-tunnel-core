name: Build Psiphon Tunnel Core

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        goos: [linux, windows]
        goarch: [amd64]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          if [ "${GOOS}" = "windows" ]; then
            go build -o dist/psiphon-${GOOS}-${GOARCH}.exe ./ConsoleClient
          else
            go build -o dist/psiphon-${GOOS}-${GOARCH} ./ConsoleClient
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: psiphon-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
